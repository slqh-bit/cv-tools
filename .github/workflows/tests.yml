name: Tests

on:
  push:
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Report every version that fails, not just the first.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # Two substitutions against requirements.txt, so everything else stays
          # in sync with it automatically:
          #
          #   opencv-python -> opencv-python-headless. Same library without the
          #   GUI bindings, which pull system libraries (libGL) the runner has
          #   no display for. The version range is kept as written.
          #
          #   rawpy dropped. It is a large binary dependency used only for
          #   camera raw decoding, and every test that touches it mocks the
          #   module out (tests/test_core.py), so a real install proves nothing
          #   and only risks a source build.
          grep -v -e '^opencv-python' -e '^rawpy' requirements.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt 'opencv-python-headless>=4.8.0,<5'

      - name: Run the test suite
        # The 40 GUI tests skip on a headless runner; the rest must pass.
        run: python -m unittest discover -s tests -t . --verbose

  gallery:
    name: Filter gallery smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          grep -v -e '^opencv-python' -e '^rawpy' requirements.txt > requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt 'opencv-python-headless>=4.8.0,<5'

      - name: Regenerate the sample images
        # Build them rather than trusting the committed copies, so a change that
        # breaks the generator is caught here.
        run: python samples/generate_samples.py

      - name: Render every registered filter
        # Exits non-zero if any filter fails on a real image, which unit tests
        # asserting on arrays will not always catch.
        run: python scripts/filter_gallery.py -o gallery-ci/

      - name: Upload the contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filter-gallery
          path: gallery-ci/_contact_sheet.png
          if-no-files-found: error
